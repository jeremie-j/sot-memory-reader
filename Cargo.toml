[workspace]
resolver = "2"
members = ["crates/memory"]
exclude = ["legacy"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
